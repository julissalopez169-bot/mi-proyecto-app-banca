    <script>
      // Prevent React 19 dev user-timing props traversal and cross-origin iframe Window.$$typeof SecurityError
      try {
        if (typeof console !== 'undefined') {
          Object.defineProperty(console, 'timeStamp', {
            value: undefined,
            configurable: false,
            writable: false,
          });
        }
      } catch (e) {
        try { delete console.timeStamp; } catch (_) {}
      }
      window.addEventListener('error', function (event) {
        if (
          event &&
          event.message &&
          (event.message.indexOf("Failed to read a named property '$$typeof' from 'Window'") !== -1 ||
           event.message.indexOf("Blocked a frame with origin") !== -1 ||
           event.message.indexOf("cross-origin frame") !== -1)
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
    </script>
